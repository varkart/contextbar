schema_version = 1
id = "opencode"
name = "OpenCode"
skills_agent_name = "opencode"

[[detection]]
type = "dir"
path = "~/.config/opencode"

[[detection]]
type = "binary"
name = "opencode"

[version]
type = "command"
binary = "opencode"
args = ["--version"]
timeout_ms = 1500
parse = "last_token"

# MCP servers live under the "mcp" key in opencode.json; each entry toggles
# itself off via its own "enabled": false rather than moving to a separate section.
# New entries need a "type" discriminator, a single "command" array (not
# command+args split), and "environment" instead of "env" — see
# opencode.ai/docs/mcp-servers.
[[mcp_sources]]
id = "opencode_json"
type = "json_key_pair"
file = "~/.config/opencode/opencode.json"
active_key = "mcp"
inline_toggle_field = "enabled"
entry_type_field = "type"
entry_type_local_value = "local"
entry_type_remote_value = "remote"
entry_command_as_array = true
entry_env_key = "environment"
jsonc = true

# OpenCode-native skills
[[skill_sources]]
id = "skills_dir"
type = "directory"
path = "~/.config/opencode/skills"
disabled_subdir = ".disabled"

# Skills shared across AI tools (Claude, Gemini, Codex, …)
[[skill_sources]]
id = "agents_skills_dir"
type = "directory"
path = "~/.agents/skills"
disabled_subdir = ".disabled"

# ── Capability toggles (Permissions & Context tab) ─────────────────
# OpenCode's "permission" key is a flat map of tool name → allow/ask/deny
# (opencode.ai/docs/permissions), not the allow/deny/ask *list* shape most
# other tools use — so these are modeled as enum capabilities instead of a
# [permissions] section. Advanced per-pattern rules hand-authored in
# opencode.json (e.g. {"*": "ask", "git push": "deny"}) aren't represented
# here — changing a toggle replaces them with a single flat value.

[[capabilities]]
id = "permission_read"
label = "Read files"
description = "permission.read"
category = "tools"
kind = "enum"
values = ["allow", "ask", "deny"]
default_value = "allow"
writer = { type = "json_flag", file = "~/.config/opencode/opencode.json", key = "permission.read", off_value = "" }

[[capabilities]]
id = "permission_edit"
label = "Edit files"
description = "permission.edit — also gates write and apply_patch"
help = "Gates the write/edit/apply_patch tools. Advanced per-pattern rules hand-authored in opencode.json (e.g. per-path allow/deny) aren't represented here — changing this replaces them with a single flat value."
category = "tools"
kind = "enum"
values = ["allow", "ask", "deny"]
default_value = "allow"
writer = { type = "json_flag", file = "~/.config/opencode/opencode.json", key = "permission.edit", off_value = "" }

